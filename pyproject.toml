[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cfdtools"
version = "0.1.0"
description = "Helpers shared across the CFD case-groups"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "gmsh>=4.15,<5",      # Python API + bundled gmsh binary
    "PyFoam>=2026.6",
    "matplotlib",         # cfdtools.monitor, cfdtools.post
    "pyvista",            # cfdtools.post: reads OpenFOAM cases
]

[project.optional-dependencies]
notebook = ["ipykernel"]          # run the example notebooks: pip install -e ".[notebook]"

[tool.setuptools.packages.find]
where = ["src"]
